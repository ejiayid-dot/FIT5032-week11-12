name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'NoMash-Library-main/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NoMash-Library-main
    env:
      VITE_WEATHER_API_BASE: https://yj-library-git.pages.dev
      VITE_BASE_PATH: /FIT5032-week11-12/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: NoMash-Library-main/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build:pages
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: NoMash-Library-main/dist
